name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WpfMarkdownViewer.slnx

      - name: Build
        run: dotnet build WpfMarkdownViewer.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/WpfMarkdownViewer.Tests/WpfMarkdownViewer.Tests.csproj --configuration Release --no-build
